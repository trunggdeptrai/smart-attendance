# Truoc khi chay lan dau: tao san tep attendance.db rong (xem docs/DEPLOY.md)
# de Docker khong tao nham thanh thu muc khi mount.
services:
  attendance-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart_face_attendance
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - OMP_NUM_THREADS=2
      - OPENBLAS_NUM_THREADS=2
      - MKL_NUM_THREADS=2
    volumes:
      # Mount thư mục dữ liệu để ảnh khuôn mặt và database SQLite không bị mất khi tắt container
      - ./data/faces:/app/data/faces
      - ./models:/app/models
      - ./attendance.db:/app/attendance.db
      - ./database_backups:/app/database_backups
      - ./backups:/app/backups
      - ./research_logs:/app/research_logs
      - ./research_results:/app/research_results
    # Lưu ý: Nếu chạy trên Linux có webcam cắm trực tiếp cổng USB, bỏ comment dòng dưới:
    # devices:
    #   - "/dev/video0:/dev/video0"